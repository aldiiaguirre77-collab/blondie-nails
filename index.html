<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blondie Nails - Tarjeta de Fidelidad</title>
    <!-- Fuentes elegantes desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fce4ec;       /* Rosa claro sólido */
            --card-bg: #ffffff;        /* Blanco para tarjetas */
            --primary-fuchsia: #d81b60;/* Fucsia sólido para destacados */
            --soft-fuchsia: #f8bbd0;   /* Fucsia tenue para estados inactivos */
            --text-color: #4a4a4a;     /* Gris oscuro elegante */
            --danger-red: #e53935;
            --gold-reward: #fbc02d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-bottom: 60px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            width: 100%;
        }

        h1 {
            color: var(--primary-fuchsia);
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .slogan {
            font-family: 'Great Vibes', cursive;
            font-size: 1.8rem;
            color: var(--primary-fuchsia);
            margin-top: -5px;
        }

        .sparkle-icon {
            color: var(--primary-fuchsia);
            display: inline-block;
        }

        /* Estilos de Tarjeta General */
        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.08);
            border: 2px solid var(--soft-fuchsia);
            margin-bottom: 20px;
            position: relative;
        }

        /* Formulario de Búsqueda */
        .search-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--soft-fuchsia);
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            text-align: center;
            color: var(--text-color);
            background-color: #fffafc;
        }

        input[type="text"]:focus {
            border-color: var(--primary-fuchsia);
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary-fuchsia);
            color: white;
            width: 100%;
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger-red);
            padding: 6px;
            border-radius: 50%;
        }

        /* Tarjeta de Fidelidad de Clienta */
        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .client-name {
            font-weight: 600;
            font-size: 1.3rem;
            color: var(--primary-fuchsia);
        }

        .progress-counter {
            font-size: 0.9rem;
            font-weight: 600;
            background-color: var(--bg-color);
            padding: 4px 12px;
            border-radius: 20px;
            color: var(--primary-fuchsia);
        }

        /* Grilla de Sellos (4 columnas x 1 fila) */
        .stamps-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        .stamp-slot {
            aspect-ratio: 1;
            border: 2px dashed var(--soft-fuchsia);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fffafc;
            cursor: pointer;
            position: relative;
        }

        .stamp-slot.active {
            border-style: solid;
            border-color: var(--primary-fuchsia);
            background-color: var(--bg-color);
            animation: pulse 0.4s ease-out;
        }

        .star-svg {
            width: 32px;
            height: 32px;
            fill: var(--soft-fuchsia);
            transition: fill 0.3s ease, transform 0.3s ease;
        }

        .stamp-slot.active .star-svg {
            fill: var(--primary-fuchsia);
            transform: scale(1.1);
        }

        @keyframes pulse {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Historial */
        .history-section {
            margin-top: 15px;
            border-top: 1px solid var(--soft-fuchsia);
            padding-top: 15px;
        }

        .history-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 8px;
        }

        .history-list {
            list-style: none;
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.85rem;
        }

        .history-item {
            padding: 4px 0;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #f0f0f0;
        }

        /* Animación de Recompensa */
        .reward-banner {
            display: none;
            background-color: #fff9c4;
            border: 2px solid var(--gold-reward);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            margin-top: 15px;
            animation: fadeIn 0.5s ease;
        }

        .reward-banner.show {
            display: block;
        }

        .reward-banner p {
            color: #5d4037;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Acceso Administrador */
        .admin-trigger {
            position: fixed;
            bottom: 15px;
            color: var(--primary-fuchsia);
            opacity: 0.4;
            cursor: pointer;
            background: none;
            border: none;
            padding: 10px;
        }

        .admin-trigger:hover {
            opacity: 1;
        }

        /* Modal / Panel Teclado PIN */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.3);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-overlay.open {
            display: flex;
        }

        .pin-pad-container {
            background: white;
            border-radius: 20px;
            padding: 25px;
            width: 300px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .pin-display {
            font-size: 1.8rem;
            letter-spacing: 8px;
            margin: 15px 0;
            min-height: 40px;
            border-bottom: 2px solid var(--soft-fuchsia);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .keypad button {
            background-color: var(--bg-color);
            color: var(--primary-fuchsia);
            font-size: 1.2rem;
            padding: 15px;
            border-radius: 12px;
        }

        /* Panel Admin */
        .admin-controls {
            width: 100%;
            margin-bottom: 20px;
        }

        .admin-badge {
            background-color: var(--primary-fuchsia);
            color: white;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 8px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Encabezado con Eslogan e Íconos de Brillo -->
        <header>
            <h1>
                <span class="sparkle-icon">✦</span> Blondie Nails <span class="sparkle-icon">✦</span>
            </h1>
            <p class="slogan">siempre lo mejor para vos</p>
        </header>

        <!-- SECCIÓN CLIENTE: Búsqueda de Tarjeta -->
        <div id="search-section" class="card">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Escribe tu nombre aquí..." autocomplete="off">
                <button class="btn-primary" onclick="searchCard()">Buscar tarjeta</button>
            </div>
        </div>

        <!-- SECCIÓN VISTA DE TARJETA -->
        <div id="card-display" class="card hidden">
            <div class="client-header">
                <div>
                    <span id="admin-indicator" class="admin-badge hidden">Modo Admin</span>
                    <div class="client-name" id="display-name">Nombre Clienta</div>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span class="progress-counter" id="display-progress">0 de 4 servicios</span>
                    <button id="delete-btn" class="btn-danger hidden" onclick="deleteCurrentCard()" title="Eliminar Tarjeta">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    </button>
                </div>
            </div>

            <!-- Grilla de 4 Columnas x 1 Fila -->
            <div class="stamps-grid">
                <div class="stamp-slot" onclick="toggleStamp(0)">
                    <svg class="star-svg" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                </div>
                <div class="stamp-slot" onclick="toggleStamp(1)">
                    <svg class="star-svg" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                </div>
                <div class="stamp-slot" onclick="toggleStamp(2)">
                    <svg class="star-svg" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                </div>
                <div class="stamp-slot" onclick="toggleStamp(3)">
                    <svg class="star-svg" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                </div>
            </div>

            <!-- Cartel Animado de Recompensa -->
            <div id="reward-banner" class="reward-banner">
                <svg width="36" height="36" fill="var(--gold-reward)" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                <p>Felicidades lograste invitar a 4 clientas, te ganaste un 50% de descuento en el servicio y diseño que quieras</p>
            </div>

            <!-- Historial Individual -->
            <div class="history-section">
                <div class="history-title">Historial de Visitas</div>
                <ul class="history-list" id="history-list">
                    <!-- Registros de fechas se insertan dinámicamente -->
                </ul>
            </div>
            
            <button class="btn-primary" style="margin-top: 15px; background-color: transparent; color: var(--primary-fuchsia); border: 1px solid var(--soft-fuchsia);" onclick="resetView()">Volver al Inicio</button>
        </div>

        <!-- SECCIÓN ADMINISTRADORA: Menú de creación -->
        <div id="admin-panel" class="admin-controls hidden">
            <button class="btn-primary" onclick="showCreateForm()" style="background-color: var(--primary-fuchsia);">+ Crear nueva tarjeta</button>
            
            <div id="create-form" class="card hidden" style="margin-top: 15px;">
                <h3 style="font-size: 1rem; color: var(--primary-fuchsia); margin-bottom: 10px;">Nueva Clienta</h3>
                <input type="text" id="new-client-name" placeholder="Nombre completo de la clienta">
                <button class="btn-primary" style="margin-top: 10px;" onclick="createNewCard()">Guardar Tarjeta</button>
            </div>
        </div>

        <!-- Ícono discreto de acceso a Administradora (Candado sin leyenda) -->
        <button class="admin-trigger" onclick="openPinModal()">
            <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        </button>
    </div>

    <!-- MODAL TECLADO TIPO CALCULADORA PARA PIN -->
    <div id="pin-modal" class="modal-overlay">
        <div class="pin-pad-container">
            <h3 style="font-size: 1rem; color: var(--text-color);">Código de Acceso</h3>
            <div id="pin-display" class="pin-display"></div>
            <div class="keypad">
                <button onclick="pressKey('1')">1</button>
                <button onclick="pressKey('2')">2</button>
                <button onclick="pressKey('3')">3</button>
                <button onclick="pressKey('4')">4</button>
                <button onclick="pressKey('5')">5</button>
                <button onclick="pressKey('6')">6</button>
                <button onclick="pressKey('7')">7</button>
                <button onclick="pressKey('8')">8</button>
                <button onclick="pressKey('9')">9</button>
                <button onclick="clearPin()" style="color: var(--danger-red);">C</button>
                <button onclick="pressKey('0')">0</button>
                <button onclick="closePinModal()">✕</button>
            </div>
        </div>
    </div>

    <script>
        // Configuración y Estado Base de Datos Local
        const PIN_CORRECTO = "2222";
        let enteredPin = "";
        let isAdmin = false;
        let currentClientKey = null;

        // Cargar datos almacenados o inicializar objeto
        let cardsDB = JSON.parse(localStorage.getItem('blondie_cards_db')) || {};

        function saveDB() {
            localStorage.setItem('blondie_cards_db', JSON.stringify(cardsDB));
        }

        // --- LÓGICA PIN Y MODO ADMIN ---
        function openPinModal() {
            enteredPin = "";
            updatePinDisplay();
            document.getElementById('pin-modal').classList.add('open');
        }

        function closePinModal() {
            document.getElementById('pin-modal').classList.remove('open');
        }

        function pressKey(num) {
            if (enteredPin.length < 4) {
                enteredPin += num;
                updatePinDisplay();
                // Verificación automática al ingresar 4 dígitos
                if (enteredPin.length === 4) {
                    setTimeout(verifyPin, 100);
                }
            }
        }

        function clearPin() {
            enteredPin = "";
            updatePinDisplay();
        }

        function updatePinDisplay() {
            document.getElementById('pin-display').innerText = "•".repeat(enteredPin.length);
        }

        function verifyPin() {
            if (enteredPin === PIN_CORRECTO) {
                isAdmin = true;
                closePinModal();
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('admin-indicator').classList.remove('hidden');
                document.getElementById('delete-btn').classList.remove('hidden');
                alert("Acceso correcto como Administradora");
            } else {
                alert("Código incorrecto");
                clearPin();
            }
        }

        // --- BÚSQUEDA Y GESTIÓN DE TARJETAS ---
        function searchCard() {
            const nameInput = document.getElementById('search-input').value.trim().toLowerCase();
            if (!nameInput) {
                alert("Por favor escribe un nombre");
                return;
            }

            if (cardsDB[nameInput]) {
                currentClientKey = nameInput;
                renderCard();
                document.getElementById('search-section').classList.add('hidden');
                document.getElementById('card-display').classList.remove('hidden');
            } else {
                alert("No se encontró ninguna tarjeta con ese nombre.");
            }
        }

        function showCreateForm() {
            document.getElementById('create-form').classList.toggle('hidden');
        }

        function createNewCard() {
            const rawName = document.getElementById('new-client-name').value.trim();
            const key = rawName.toLowerCase();

            if (!rawName) {
                alert("Ingresa el nombre de la clienta");
                return;
            }

            if (cardsDB[key]) {
                alert("Ya existe una tarjeta para este nombre");
                return;
            }

            // Estructura de tarjeta individual
            cardsDB[key] = {
                displayName: rawName,
                stamps: 0,
                history: []
            };

            saveDB();
            document.getElementById('new-client-name').value = "";
            document.getElementById('create-form').classList.add('hidden');
            
            // Abre automáticamente la tarjeta recién creada
            currentClientKey = key;
            renderCard();
            document.getElementById('search-section').classList.add('hidden');
            document.getElementById('card-display').classList.remove('hidden');
        }

        function deleteCurrentCard() {
            if (!isAdmin) return;
            
            if (confirm(`¿Estás segura de eliminar la tarjeta de ${cardsDB[currentClientKey].displayName}?`)) {
                delete cardsDB[currentClientKey];
                saveDB();
                resetView();
            }
        }

        // --- DIBUJO Y ACTUALIZACIÓN DE TARJETA ---
        function renderCard() {
            const card = cardsDB[currentClientKey];
            document.getElementById('display-name').innerText = card.displayName;
            document.getElementById('display-progress').innerText = `${card.stamps} de 4 servicios`;

            // Actualizar slots de estrellas
            const slots = document.querySelectorAll('.stamp-slot');
            slots.forEach((slot, index) => {
                if (index < card.stamps) {
                    slot.classList.add('active');
                } else {
                    slot.classList.remove('active');
                }
            });

            // Mostrar/ocultar banner de recompensa
            const rewardBanner = document.getElementById('reward-banner');
            if (card.stamps === 4) {
                rewardBanner.classList.add('show');
            } else {
                rewardBanner.classList.remove('show');
            }

            // Renderizar Historial
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = "";
            if (card.history.length === 0) {
                historyList.innerHTML = `<li class="history-item" style="color: #999;">Sin visitas registradas</li>`;
            } else {
                card.history.slice().reverse().forEach((record, index) => {
                    historyList.innerHTML += `
                        <li class="history-item">
                            <span>Servicio #${card.history.length - index}</span>
                            <span>${record}</span>
                        </li>
                    `;
                });
            }
        }

        // Marcar / Desmarcar sellos (Solo Admin)
        function toggleStamp(index) {
            if (!isAdmin) return; // Clientes no pueden alterar sellos

            const card = cardsDB[currentClientKey];
            const currentDate = new Date().toLocaleDateString('es-ES', {
                year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            // Si se hace clic en el siguiente espacio libre -> Agregar sello
            if (index === card.stamps && card.stamps < 4) {
                card.stamps++;
                card.history.push(currentDate);

                // Si se llegó a 4 servicios, notificar y reiniciar contador internamente tras la recompensa
                if (card.stamps === 4) {
                    saveDB();
                    renderCard();
                    setTimeout(() => {
                        if (confirm("¡Se ha completado la tarjeta! ¿Deseas reiniciar los sellos para un nuevo ciclo?")) {
                            card.stamps = 0;
                            saveDB();
                            renderCard();
                        }
                    }, 500);
                    return;
                }
            } 
            // Si se toca la última estrella marcada -> Permite desmarcar (corrección)
            else if (index === card.stamps - 1) {
                card.stamps--;
                card.history.pop();
            }

            saveDB();
            renderCard();
        }

        function resetView() {
            currentClientKey = null;
            document.getElementById('search-input').value = "";
            document.getElementById('card-display').classList.add('hidden');
            document.getElementById('search-section').classList.remove('hidden');
        }
